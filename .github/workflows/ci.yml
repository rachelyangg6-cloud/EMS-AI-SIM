# Tests on every pull request, so a problem surfaces before it reaches main —
# where it would otherwise be caught by the deploy workflow, after review.
name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # No `embeddings` extra: that is where sentence-transformers (and torch)
      # now lives, and no test needs it — the suite injects a fake embed
      # function. Extras add to the base set rather than replacing it, so this
      # only skips torch because sentence-transformers is no longer a base dep.
      - run: pip install -e '.[web,dev]'
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      # `npm run build` is `tsc -b && vite build`, so this type-checks too.
      - run: npm run build
        working-directory: frontend
