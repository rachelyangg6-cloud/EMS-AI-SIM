# What the numbers look like when the scenario does not say.
#
# Only 26 of 150 approved scenarios state a respiratory rate, 29 a pulse, 18 an
# SpO2 and 12 a blood pressure. Without something here the monitor is four empty
# tiles on most calls, which teaches nothing.
#
# ── Where the numbers come from ─────────────────────────────────────────────
# `baseline` is taken from commonly published normal ranges, noted below.
# `conditions` and `findings` are NOT sourced — they are my clinical guesses at
# what each presentation would produce, written to be plausible rather than
# looked up. Treat them accordingly.
#
# ── These are simulator-generated, not vetted clinical fact ──────────────────
# Anything filled in from this file is marked `generated` all the way to the
# screen, where it renders with a SIM tag. A number the scenario itself states
# always wins and is never marked. Do not read these as reference ranges: they
# are here so a trainee has something to react to.
#
# They have not been reviewed by a practitioner. When a scenario's real numbers
# get authored into the file, they override this and the tag disappears.
#
# ── How a profile is chosen ─────────────────────────────────────────────────
# The scenario's first `conditions:` slug that appears below wins; failing that
# `baseline` for the age group. Ranges are inclusive and are drawn once per
# scenario, seeded by scenario_id, so a case has the same numbers every time you
# run it.

# Resting ranges by age. Fallback when no condition profile matches.
# Keys must be `age_groups` from system/source-vocabulary.json — a key that is
# not one silently hands every patient the adult ranges.
#
# ── Where these come from ────────────────────────────────────────────────────
#   rr, hr and sbp are the commonly published normal resting ranges by age.
#
# Two judgement calls sit on top of those ranges, and neither is sourced:
#  - `pediatric` spans ages 1–12 in this project, though references often band
#    it more finely (toddler / preschooler / school-age). School-age 6–12 is used
#    as the representative band, since it is the middle of the range.
#  - `dbp` and `spo2` are derived: diastolic is scaled from an adult normal of
#    ≤80, and SpO2 is a guess. Both still need a practitioner's eye.
# Geriatric uses the adult rows unchanged rather than inventing a difference.
baseline:
  adult:      {rr: [12, 20],  hr: [60, 100],  spo2: [96, 99], sbp: [105, 120], dbp: [65, 80]}
  geriatric:  {rr: [12, 20],  hr: [60, 100],  spo2: [94, 98], sbp: [105, 120], dbp: [65, 80]}
  pediatric:  {rr: [18, 30],  hr: [65, 120],  spo2: [96, 99], sbp: [94, 112],  dbp: [56, 72]}
  neonate:    {rr: [30, 60],  hr: [100, 170], spo2: [95, 99], sbp: [50, 70],   dbp: [30, 45]}

# ── Findings the scenario already states ────────────────────────────────────
# These outrank everything. A scenario whose text says "apneic" must not be
# handed a respiratory rate of 16 because its condition slug says asthma — the
# words the author wrote are the most vetted thing on the page.
# Keys are `effort` states from `EFFORT_STATES` in ems/sim/scene.py.
findings:
  # Peri-arrest. A normal blood pressure alongside agonal respirations is the
  # kind of internal contradiction that teaches a trainee to ignore the monitor.
  # `null` means *do not invent this one* — you cannot take a blood pressure or
  # a saturation off a pulseless patient, and a blank tile is the true reading.
  apneic:               {rr: [0, 0],   spo2: null, hr: null, sbp: null, dbp: null}
  agonal:               {rr: [4, 8],   spo2: [60, 78], hr: [30, 60],  sbp: [58, 82], dbp: [34, 50]}
  obstructed:           {rr: [6, 14],  spo2: [70, 86], hr: [110, 138]}
  accessory-muscle-use: {rr: [26, 38], spo2: [82, 90], hr: [104, 130]}
  labored:              {rr: [24, 34], spo2: [86, 92], hr: [98, 124]}
  shallow:              {rr: [8, 12],  spo2: [86, 93]}
  # Not an `EFFORT_STATES` value. "Inadequate breathing" is the EMT's conclusion
  # rather than an observation, so it deliberately does *not* go in scene.py's
  # effort table — the figure must not be drawn shallow on the strength of a
  # judgement the author never described. It belongs here, where it moves only
  # the numbers: a patient the scenario calls inadequate must not read RR 14 and
  # a saturation of 96%.
  inadequate-breathing: {rr: [6, 10],  spo2: [82, 90], hr: [104, 130]}

# Per-condition overrides. Only the keys present are overridden; anything absent
# falls through to the age baseline above.
conditions:
  respiratory-failure: {rr: [28, 40], hr: [104, 132], spo2: [80, 88]}
  hypoxia:             {rr: [24, 34], hr: [98, 124],  spo2: [82, 90]}
  asthma:              {rr: [24, 34], hr: [100, 126], spo2: [88, 93]}
  pulmonary-edema:     {rr: [26, 36], hr: [100, 124], spo2: [84, 91], sbp: [140, 176], dbp: [86, 104]}
  tension-pneumothorax: {rr: [28, 38], hr: [118, 140], spo2: [80, 89], sbp: [76, 94], dbp: [48, 60]}
  foreign-body-airway-obstruction: {rr: [4, 10], hr: [110, 136], spo2: [72, 85]}

  acute-mi:            {rr: [18, 24], hr: [88, 116],  spo2: [92, 96], sbp: [96, 148], dbp: [60, 90]}
  chest-pain:          {rr: [16, 22], hr: [84, 108],  spo2: [94, 98]}
  cardiogenic-shock:   {rr: [22, 30], hr: [110, 134], spo2: [86, 93], sbp: [68, 88],  dbp: [42, 58]}
  hemorrhagic-shock:   {rr: [24, 32], hr: [116, 140], spo2: [88, 94], sbp: [72, 92],  dbp: [44, 58]}
  hypertensive-emergency: {rr: [16, 20], hr: [78, 100], spo2: [94, 98], sbp: [186, 224], dbp: [110, 132]}
  aortic-dissection:   {rr: [20, 26], hr: [96, 122],  spo2: [92, 96], sbp: [150, 200], dbp: [88, 112]}
  traumatic-arrest:    {rr: [0, 0],   hr: [0, 0],     spo2: [0, 0],   sbp: [0, 0],   dbp: [0, 0]}

  anaphylaxis:         {rr: [24, 34], hr: [112, 138], spo2: [86, 93], sbp: [74, 94],  dbp: [44, 60]}
  sepsis:              {rr: [22, 30], hr: [104, 128], spo2: [90, 95], sbp: [80, 100], dbp: [48, 64]}
  hypoglycemia:        {rr: [16, 22], hr: [96, 120],  spo2: [95, 99]}
  hyperglycemia:       {rr: [20, 28], hr: [98, 122],  spo2: [95, 98]}
  diabetic-ketoacidosis: {rr: [26, 36], hr: [108, 130], spo2: [94, 98], sbp: [88, 106], dbp: [52, 68]}
  opioid-overdose:     {rr: [4, 9],   hr: [48, 66],   spo2: [76, 88]}
  stroke:              {rr: [14, 20], hr: [70, 96],   spo2: [93, 97], sbp: [150, 190], dbp: [88, 108]}
  seizure:             {rr: [18, 28], hr: [98, 126],  spo2: [90, 96]}
  traumatic-brain-injury: {rr: [10, 26], hr: [52, 78], spo2: [90, 96], sbp: [148, 186], dbp: [86, 102]}
  hypothermia:         {rr: [8, 14],  hr: [40, 58],   spo2: [90, 95], sbp: [88, 108], dbp: [54, 68]}
  drowning:            {rr: [22, 34], hr: [104, 130], spo2: [78, 90]}
  crush-syndrome:      {rr: [22, 30], hr: [106, 130], spo2: [90, 95], sbp: [82, 102], dbp: [50, 64]}
  excited-delirium:    {rr: [26, 36], hr: [126, 152], spo2: [92, 97], sbp: [148, 180], dbp: [88, 106]}
